<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1120" height="640" rx="14" fill="#ffffff"/>
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">시스템 구성</text>

  <!-- PC -->
  <rect x="20" y="56" width="440" height="560" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#0f172a">PC (Windows 10/11)</text>

  <rect x="40" y="98" width="400" height="58" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="56" y="122" font-size="14" font-weight="700" fill="#0f172a">ClusterConsole.exe (런처)</text>
  <text x="56" y="143" font-size="12" fill="#475569">대상 선택 → 환경 점검 → 대상 준비 → 화면 → 콘솔</text>

  <rect x="40" y="170" width="400" height="330" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="56" y="194" font-size="14" font-weight="700" fill="#312e81">WSL2 · Ubuntu-24.04</text>

  <rect x="56" y="206" width="368" height="150" rx="8" fill="#fff" stroke="#6366f1"/>
  <text x="70" y="228" font-size="14" font-weight="700" fill="#0f172a">테스트 콘솔 cluster_app.py</text>
  <text x="70" y="247" font-size="12" fill="#475569">웹 화면 127.0.0.1:8765 (런처 창 안에 보임)</text>
  <rect x="70" y="258" width="164" height="40" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="152" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">가상 ECU</text>
  <text x="152" y="291" text-anchor="middle" font-size="11" fill="#9a3412">CAN 프레임 초당 20번</text>
  <rect x="246" y="258" width="164" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="328" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">UDS 클라이언트</text>
  <text x="328" y="291" text-anchor="middle" font-size="11" fill="#1e3a8a">DTC 읽기, 지우기</text>
  <rect x="70" y="306" width="340" height="38" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text x="240" y="323" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">시험: 단위, 종단(결함 → DTC), 교차 확인, 환경 점검</text>
  <text x="240" y="337" text-anchor="middle" font-size="11" fill="#14532d">대상 프로그램 시작·중지 (SSH)</text>

  <rect x="56" y="366" width="368" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="70" y="388" font-size="13" font-weight="700" fill="#0f172a">실행 스크립트</text>
  <text x="70" y="408" font-size="12" fill="#475569">rpi4/start_pi.sh · start_env.sh · run_qt.sh · run_diag.sh</text>

  <rect x="56" y="432" width="368" height="56" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="70" y="454" font-size="13" font-weight="700" fill="#0f172a">빌드 도구</text>
  <text x="70" y="474" font-size="12" fill="#475569">QNX SDP 8.0 (qcc) · Qt 6.8.5 (PC용 + QNX용)</text>

  <rect x="40" y="514" width="190" height="86" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="135" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">QEMU 창</text>
  <text x="135" y="560" text-anchor="middle" font-size="12" fill="#475569">VM의 계기판 화면</text>
  <text x="135" y="580" text-anchor="middle" font-size="11" fill="#64748b">(VM일 때, WSL이 띄움)</text>
  <rect x="250" y="514" width="190" height="86" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="345" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">UltraVNC 뷰어</text>
  <text x="345" y="560" text-anchor="middle" font-size="12" fill="#475569">파이의 계기판 화면</text>
  <text x="345" y="580" text-anchor="middle" font-size="11" fill="#64748b">(파이일 때)</text>

  <!-- target -->
  <rect x="660" y="56" width="440" height="560" rx="12" fill="#fef2f2" stroke="#f87171"/>
  <text x="680" y="84" font-size="16" font-weight="700" fill="#0f172a">대상: QNX 8.0</text>
  <text x="680" y="104" font-size="12" fill="#475569">라즈베리 파이 4 (Wi-Fi) 또는 QEMU VM (WSL 안)</text>

  <rect x="680" y="124" width="400" height="66" rx="8" fill="#fff" stroke="#c2410c"/>
  <text x="696" y="148" font-size="14" font-weight="700" fill="#0f172a">cluster_gateway</text>
  <text x="696" y="168" font-size="12" fill="#475569">UDP 5555로 CAN 프레임을 받아 차량 상태를 유지,</text>
  <text x="696" y="184" font-size="12" fill="#475569">E2E 보호(CRC, 카운터)를 붙여 초당 20번 전달</text>

  <rect x="680" y="236" width="400" height="86" rx="8" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="696" y="260" font-size="14" font-weight="700" fill="#0f172a">qt_cluster (Qt Quick 계기판)</text>
  <text x="696" y="280" font-size="12" fill="#475569">E2E 검사: CRC, 카운터 반복·건너뜀, 시간 초과, 값 범위</text>
  <text x="696" y="296" font-size="12" fill="#475569">이상하면 안전 화면 (NO SIGNAL, ---)</text>
  <text x="696" y="312" font-size="12" fill="#475569">검사 결과와 하트비트를 cluster_diag에 알림</text>

  <rect x="680" y="370" width="400" height="86" rx="8" fill="#fff" stroke="#1d4ed8"/>
  <text x="696" y="394" font-size="14" font-weight="700" fill="#0f172a">cluster_diag (진단, 별도 프로세스)</text>
  <text x="696" y="414" font-size="12" fill="#475569">결과를 DTC로 판단해 파일에 저장 (재시작해도 남음)</text>
  <text x="696" y="430" font-size="12" fill="#475569">UDS 서버: UDP 5556, ISO-TP (10 3E 22 19 14 27 11)</text>
  <text x="696" y="446" font-size="12" fill="#475569">계기판 하트비트가 끊기면 U1A04</text>

  <rect x="680" y="500" width="400" height="100" rx="8" fill="#fff" stroke="#64748b"/>
  <text x="696" y="524" font-size="14" font-weight="700" fill="#0f172a">화면 출력 (QNX Screen)</text>
  <text x="696" y="546" font-size="12" fill="#475569">파이: 가상 디스플레이(ID 1024) → vncserv (5900)</text>
  <text x="696" y="566" font-size="12" fill="#475569">VM: virtio-vga → QEMU 창</text>
  <text x="696" y="586" font-size="12" fill="#475569">Qt 플랫폼: qnx:rootwindow</text>

  <!-- inside target arrows -->
  <line x1="880" y1="190" x2="880" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="890" y="217" font-size="11" fill="#475569">QNX 메시지 (MsgSend)</text>
  <line x1="840" y1="322" x2="840" y2="368" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="732" y="350" font-size="11" fill="#475569">펄스: 검사 결과</text>
  <line x1="940" y1="368" x2="940" y2="324" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="950" y="350" font-size="11" fill="#475569">펄스: 서비스 램프</text>
  <path d="M1086 300 C1110 300 1110 520 1082 520" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- network -->
  <rect x="478" y="56" width="164" height="560" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="560" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">네트워크</text>
  <text x="560" y="98" text-anchor="middle" font-size="11" fill="#64748b">파이: 같은 공유기 Wi-Fi</text>
  <text x="560" y="114" text-anchor="middle" font-size="11" fill="#64748b">VM: virbr0 브리지</text>

  <line x1="410" y1="270" x2="678" y2="160" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="490" y="180" width="140" height="40" rx="6" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="560" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">CAN 프레임</text>
  <text x="560" y="212" text-anchor="middle" font-size="11" fill="#9a3412">UDP 5555</text>

  <line x1="412" y1="286" x2="678" y2="402" stroke="#1d4ed8" stroke-width="2.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <rect x="490" y="306" width="140" height="40" rx="6" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="560" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">UDS 요청 / 응답</text>
  <text x="560" y="338" text-anchor="middle" font-size="11" fill="#1e3a8a">UDP 5556</text>

  <line x1="424" y1="394" x2="676" y2="452" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <rect x="490" y="398" width="140" height="40" rx="6" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="560" y="414" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">SSH / SCP</text>
  <text x="560" y="430" text-anchor="middle" font-size="11" fill="#14532d">배포, 시작·중지, 상태</text>

  <line x1="678" y1="550" x2="442" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="510" y="524" width="100" height="22" rx="6" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="560" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">VNC 5900</text>
  <text x="560" y="572" text-anchor="middle" font-size="11" fill="#64748b">(파이일 때)</text>
</svg>
