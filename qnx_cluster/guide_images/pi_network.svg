<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="380" rx="14" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">파이 연결 구성 (모니터 없이)</text>

  <!-- PC -->
  <rect x="30" y="70" width="230" height="150" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="85" y="88" width="120" height="70" rx="4" fill="#0f172a"/>
  <rect x="91" y="94" width="108" height="58" rx="2" fill="#1e293b"/>
  <text x="145" y="128" text-anchor="middle" font-size="11" fill="#fbbf24">계기판 (VNC)</text>
  <rect x="70" y="160" width="150" height="8" rx="3" fill="#475569"/>
  <text x="145" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">PC (Windows)</text>
  <text x="145" y="208" text-anchor="middle" font-size="12" fill="#475569">ClusterConsole.exe, WSL</text>

  <!-- router -->
  <rect x="345" y="95" width="210" height="100" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
  <line x1="410" y1="95" x2="400" y2="70" stroke="#a16207" stroke-width="3"/>
  <line x1="490" y1="95" x2="500" y2="70" stroke="#a16207" stroke-width="3"/>
  <text x="450" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">공유기 (Wi-Fi)</text>
  <text x="450" y="155" text-anchor="middle" font-size="12" fill="#713f12">PC와 파이가 같은 네트워크</text>
  <text x="450" y="173" text-anchor="middle" font-size="12" fill="#713f12">예: 192.168.3.x</text>

  <!-- Pi -->
  <rect x="640" y="70" width="230" height="150" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <rect x="675" y="88" width="160" height="78" rx="6" fill="#16a34a"/>
  <rect x="690" y="100" width="40" height="40" rx="3" fill="#d1d5db"/>
  <rect x="745" y="100" width="22" height="22" rx="2" fill="#111827"/>
  <rect x="780" y="96" width="44" height="10" rx="2" fill="#a3a3a3"/>
  <rect x="780" y="112" width="44" height="10" rx="2" fill="#a3a3a3"/>
  <text x="755" y="158" text-anchor="middle" font-size="11" fill="#ecfccb">Raspberry Pi 4</text>
  <text x="755" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">QNX 8.0 (SD 카드)</text>
  <text x="755" y="208" text-anchor="middle" font-size="12" fill="#475569">모니터 없음, 가상 디스플레이</text>

  <!-- links -->
  <line x1="262" y1="145" x2="343" y2="145" stroke="#475569" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)" stroke-dasharray="7 5"/>
  <line x1="557" y1="145" x2="638" y2="145" stroke="#475569" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)" stroke-dasharray="7 5"/>
  <text x="302" y="133" text-anchor="middle" font-size="11" fill="#475569">Wi-Fi/유선</text>
  <text x="598" y="133" text-anchor="middle" font-size="11" fill="#475569">Wi-Fi</text>

  <!-- traffic -->
  <rect x="30" y="250" width="420" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="276" font-size="13" font-weight="700" fill="#0f172a">PC ↔ 파이 사이에 오가는 것</text>
  <text x="48" y="298" font-size="12" fill="#334155">SSH 22: 프로그램 배포, 시작·중지, 상태 (qnxuser 키)</text>
  <text x="48" y="317" font-size="12" fill="#334155">UDP 5555: 가상 ECU의 CAN 프레임 (초당 20번)</text>
  <text x="48" y="336" font-size="12" fill="#334155">UDP 5556: UDS 진단 · TCP 5900: VNC 화면</text>

  <rect x="470" y="250" width="400" height="104" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="488" y="276" font-size="13" font-weight="700" fill="#14532d">파이에 꽂는 것</text>
  <text x="488" y="298" font-size="12" fill="#334155">microSD: QNX 이미지 + wpa_supplicant.conf (Wi-Fi)</text>
  <text x="488" y="317" font-size="12" fill="#334155">USB-C 전원: 5V 3A</text>
  <text x="488" y="336" font-size="12" fill="#334155">HDMI, 키보드, 마우스: 필요 없음</text>
</svg>
